<!doctype html>
<!--
  BLOG POST TEMPLATE

  To add a post:
    1. Copy this file to posts/YYYY-MM-DD-short-title.html
    2. Replace every ALL-CAPS placeholder below.
    3. Add a matching summary card to the .post-list in /index.html.

  This template is not linked from anywhere, but on most plain static hosts it
  IS still reachable at /posts/_template.html. It is marked noindex so search
  engines skip it.
-->
<html class="no-js" lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>POST TITLE | San Francisco Neighborhoods United</title>
  <link rel="stylesheet" href="../css/style.css">
  <meta name="description" content="POST SUMMARY">
  <!-- Delete this line in real posts — it only keeps the blank template out of search results. -->
  <meta name="robots" content="noindex">

  <meta property="og:title" content="POST TITLE">
  <meta property="og:type" content="article">
  <meta property="og:url" content="https://www.sanfrancisconeighborhoodsunited.org/posts/POST-FILENAME.html">
  <meta property="og:description" content="POST SUMMARY">
  <meta property="og:image" content="https://www.sanfrancisconeighborhoodsunited.org/icon.png">
  <meta property="og:image:alt" content="San Francisco Neighborhoods United">

  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../icon.png">

  <link rel="manifest" href="../site.webmanifest">
  <meta name="theme-color" content="#e7e2dd">
</head>

<body>

  <!-- ===== SHARED HEADER — keep identical on every page ===== -->
  <header class="site-header">
    <div class="wrap">
      <div class="site-branding">
        <p class="site-title">San Francisco Neighborhoods United</p>
        <p class="site-tagline">See our <a href="https://www.facebook.com/groups/1652509069157510">Facebook group</a> for more.</p>
      </div>
      <nav class="site-nav" aria-label="Main">
        <a class="nav-link" href="../index.html">Blog</a>
        <a class="nav-link" href="../about.html">About</a>
      </nav>
    </div>
  </header>
  <!-- ===== END SHARED HEADER ===== -->

  <main id="main">
    <div class="wrap">
    <article class="post prose">
      <h1 class="page-title">POST TITLE</h1>
      <p class="post-meta"><time datetime="YYYY-MM-DD">MONTH DAY, YEAR</time></p>

      <p>Post body goes here.</p>
    </article>

    <p class="back-link"><a href="../index.html">&larr; Back to the blog</a></p>
    </div>
  </main>

  <!-- ===== SHARED FOOTER — keep identical on every page ===== -->
  <footer class="site-footer">
    <div class="wrap">
      <p class="footer-title">San Francisco Neighborhoods United</p>
      <p class="footer-contact">
        <a href="mailto:admin@sanfrancisconeighborhoodsunited.org">admin@sanfrancisconeighborhoodsunited.org</a>
      </p>
    </div>
  </footer>
  <!-- ===== END SHARED FOOTER ===== -->

  <script src="../js/app.js"></script>

</body>

</html>
